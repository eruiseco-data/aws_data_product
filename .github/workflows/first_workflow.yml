name: AWS Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        
      - name: Authenticate with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800168266979:role/data-product-tambote-github-actions-role
          aws-region: us-east-1

      - name: Smoke Test
        run: aws sts get-caller-identity
