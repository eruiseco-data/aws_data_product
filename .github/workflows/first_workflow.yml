name: AWS Connection Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4

      - name: Decode OIDC token claims (debug)
        uses: actions/github-script@v7
        with:
          script: |
            const idToken = await core.getIDToken('sts.amazonaws.com');
            const payload = idToken.split('.')[1];
            const decoded = Buffer.from(payload, 'base64').toString('utf8');
            const claims = JSON.parse(decoded);
            console.log('CLAIMS');
            console.log('aud:', claims.aud);
            console.log('sub:', claims.sub);
            console.log('repository:', claims.repository);
            console.log('repository_owner:', claims.repository_owner);
            console.log('ref:', claims.ref);
            console.log('event_name:', claims.event_name);
            console.log('workflow_ref:', claims.workflow_ref);

      - name: Authenticate with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::800168266979:role/data-product-tambote-github-actions-role
          aws-region: us-east-1

      - name: Smoke Test
        run: aws sts get-caller-identity
